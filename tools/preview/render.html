<script type="module">

const FACE = { Front: [0,0,-1], Back: [0,0,1], Top: [0,1,0], Bottom: [0,-1,0], Right: [1,0,0], Left: [-1,0,0] };

      for (let k = 0; k <= 8; k++) { const a = k / 8 * Math.PI / 2; pts.push(new THREE.Vector2(r - rr + Math.cos(a) * rr, 0.5 - rr + Math.sin(a) * rr)); }

      transparent: p.tr > 0 || p.mat === 'Glass' || p.mat === 'ForceField', opacity: (1 - p.tr) * (p.mat === 'ForceField' ? 0.4 : p.mat === 'Glass' ? 0.6 : 1) });

scenes.forEach((s, i) => {
